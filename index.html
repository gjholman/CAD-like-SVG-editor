<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAD-like SVG editor</title>
    <meta
      name="description"
      content="Draw SVGs the way CAD sketches them: add relations and dimensions, and a solver keeps the geometry consistent."
    />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <a class="brand" href="/about.html">Sketch</a>

        <div class="group" role="radiogroup" aria-label="Tool">
          <button data-tool="select" aria-pressed="true">Select <kbd>V</kbd></button>
          <button data-tool="line" aria-pressed="false">Line <kbd>L</kbd></button>
          <button data-tool="arc" aria-pressed="false">Arc <kbd>A</kbd></button>
        </div>

        <div class="group" aria-label="Relations">
          <button data-relation="horizontal" disabled>Horizontal <kbd>&#8679;H</kbd></button>
          <button data-relation="vertical" disabled>Vertical <kbd>&#8679;V</kbd></button>
          <button data-relation="coincident" disabled>Coincident <kbd>&#8679;C</kbd></button>
          <button data-relation="fix" disabled>Fix <kbd>&#8679;F</kbd></button>
          <button data-action="dimension" disabled>Dimension <kbd>D</kbd></button>
        </div>

        <div class="group">
          <button data-action="undo" disabled>Undo</button>
          <button data-action="redo" disabled>Redo</button>
        </div>

        <div class="group">
          <button data-action="fit">Zoom to fit</button>
        </div>

        <div class="group">
          <button data-action="save">Save</button>
          <button data-action="open">Open</button>
          <button data-action="export">Export SVG</button>
        </div>
        <input type="file" id="file" accept=".json,application/json" hidden />

      </header>

      <div class="workspace">
        <div class="canvas">
          <svg class="sketch-stage" id="stage" aria-label="Sketch canvas"></svg>
        </div>

        <aside class="panel" aria-label="Relations">
          <h2>Relations <span class="count" id="relation-count">0</span></h2>
          <div id="relations" class="relations"></div>
          <p class="empty" id="relations-empty">
            Select two points, then add a relation. Shift-click to select more than one.
          </p>
        </aside>
      </div>

      <footer class="bar status">
        <span id="status-dot" class="dotc"></span>
        <span id="status-text">&nbsp;</span>
        <span id="dof"></span>
        <span class="hint" id="hint"></span>
        <span class="spacer"></span>
        <span id="coords">X 0.00  Y 0.00 px</span>
      </footer>
    </div>

    <dialog id="output">
      <form method="dialog" class="output-head">
        <h2 id="output-title">Export</h2>
        <button value="close">Close</button>
      </form>
      <p class="output-note" id="output-note"></p>
      <textarea id="output-text" readonly spellcheck="false" aria-label="File contents"></textarea>
      <div class="output-actions">
        <button data-action="copy">Copy to clipboard</button>
        <button data-action="download">Download</button>
      </div>
    </dialog>
  </body>
</html>
