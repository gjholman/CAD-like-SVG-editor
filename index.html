<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAD-like SVG editor</title>
    <meta
      name="description"
      content="Draw SVGs the way CAD sketches them: add relations and dimensions, and a solver keeps the geometry consistent."
    />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- Icons lifted from docs/mockups/ui-mockup-v1.html, so the app and the
         mockup stay the same drawing. -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <defs>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M6 3v15l4-4 3 6 2.4-1.1-3-5.9H18z"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="0.8"/></symbol>
    <symbol id="i-arc" viewBox="0 0 24 24"><path d="M5 18a9 9 0 0 1 14 0"/><circle cx="5" cy="18" r="1.4"/><circle cx="19" cy="18" r="1.4"/></symbol>
    <symbol id="i-dim" viewBox="0 0 24 24"><path d="M4 8v8M20 8v8M4 12h16"/><path d="M4 12l3-1.8v3.6zM20 12l-3-1.8v3.6z" fill="currentColor"/></symbol>
    <symbol id="i-construct" viewBox="0 0 24 24"><path d="M3 12h4M10 12h4M17 12h4"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="M12 3l-2.5 2.8h5zM12 21l-2.5-2.8h5zM3 12l2.8-2.5v5zM21 12l-2.8-2.5v5z" fill="currentColor"/></symbol>
    <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="M15 15l5 5"/></symbol>
    <symbol id="i-horizontal" viewBox="0 0 24 24"><path d="M4 12h16"/><circle cx="4" cy="12" r="1.5"/><circle cx="20" cy="12" r="1.5"/></symbol>
    <symbol id="i-vertical" viewBox="0 0 24 24"><path d="M12 4v16"/><circle cx="12" cy="4" r="1.5"/><circle cx="12" cy="20" r="1.5"/></symbol>
    <symbol id="i-coincident" viewBox="0 0 24 24"><rect x="9.5" y="9.5" width="5" height="5"/><path d="M3 21l6.5-6.5M21 3l-6.5 6.5"/></symbol>
    <symbol id="i-equal" viewBox="0 0 24 24"><path d="M6 9h12M6 15h12"/></symbol>
    <symbol id="i-tangent" viewBox="0 0 24 24"><circle cx="12" cy="15" r="5"/><path d="M4 10h16"/></symbol>
    <symbol id="i-fix" viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="1.5"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 6l5 5-5 5"/><path d="M20 11H10a5 5 0 0 0 0 10h3"/></symbol>
    <symbol id="i-caret" viewBox="0 0 24 24"><path d="M7 9l5 5 5-5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 6l10 6-10 6z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></symbol>
      </defs>
    </svg>

    <div class="app">
      <header class="menubar">
        <a class="brand" href="/about.html">Sketch</a>

        <span class="mb-group">
          <button class="iconbtn" data-action="undo" data-tip="Undo (⌘Z)" aria-label="Undo" disabled>
            <svg class="i" width="16" height="16"><use href="#i-undo" /></svg>
          </button>
          <button class="iconbtn" data-action="redo" data-tip="Redo (⇧⌘Z)" aria-label="Redo" disabled>
            <svg class="i" width="16" height="16"><use href="#i-redo" /></svg>
          </button>
        </span>

        <span class="mb-group">
          <button class="btn" data-action="open">Open</button>
          <button class="btn" data-action="save">Save</button>
          <button class="btn btn-primary" data-action="export">Export SVG</button>
        </span>
        <input type="file" id="file" accept=".json,application/json" hidden />
      </header>

      <div class="workspace">
        <nav class="toolbar" aria-label="Tools">
          <button class="tool" data-tool="select" data-tip="Select (V)" aria-label="Select" aria-pressed="true">
            <svg class="i" width="20" height="20"><use href="#i-select" /></svg><kbd>V</kbd>
          </button>
          <span class="tool-sep"></span>
          <button class="tool" data-tool="line" data-tip="Line (L)" aria-label="Line" aria-pressed="false">
            <svg class="i" width="20" height="20"><use href="#i-line" /></svg><kbd>L</kbd>
          </button>
          <button class="tool" data-tool="arc" data-tip="Arc (A)" aria-label="Arc" aria-pressed="false">
            <svg class="i" width="20" height="20"><use href="#i-arc" /></svg><kbd>A</kbd>
          </button>
          <span class="tool-sep"></span>
          <button class="tool" data-action="dimension" data-tip="Smart dimension (D)" aria-label="Smart dimension">
            <svg class="i" width="20" height="20"><use href="#i-dim" /></svg><kbd>D</kbd>
          </button>
          <span class="tool-sep"></span>
          <button class="tool" data-action="delete" data-tip="Delete (⌫)" aria-label="Delete">
            <svg class="i" width="20" height="20"><use href="#i-trash" /></svg>
          </button>
          <span class="tool-grow"></span>
          <button class="tool" data-action="fit" data-tip="Zoom to fit" aria-label="Zoom to fit">
            <svg class="i" width="20" height="20"><use href="#i-zoom" /></svg>
          </button>
        </nav>

        <section class="canvas-wrap">
          <div class="canvas">
            <svg class="sketch-stage" id="stage" aria-label="Sketch canvas"></svg>

            <div class="hud" role="toolbar" aria-label="View options">
              <button data-hud="grid" class="on" aria-pressed="true"><i class="led"></i>Grid <kbd>G</kbd></button>
              <button data-hud="snap" class="on" aria-pressed="true"><i class="led"></i>Snap</button>
              <button data-hud="dims" class="on" aria-pressed="true"><i class="led"></i>Dimensions</button>
            </div>
          </div>
        </section>

        <aside class="panels" aria-label="Panels">
          <section class="panel" id="p-props">
            <button class="panel-head" aria-expanded="true">
              <svg class="i" width="12" height="12"><use href="#i-caret" /></svg><span>Selection</span>
            </button>
            <div class="panel-body">
              <div class="pname" id="sel-name">Nothing selected</div>
              <div class="psub" id="sel-sub">Click geometry, or shift-click to select more.</div>

              <div class="sect"><span>Add relation</span></div>
              <div class="addrel">
                <button data-relation="horizontal" disabled>
                  <svg class="i" width="16" height="16"><use href="#i-horizontal" /></svg><span>Horizontal</span><b>⇧H</b>
                </button>
                <button data-relation="vertical" disabled>
                  <svg class="i" width="16" height="16"><use href="#i-vertical" /></svg><span>Vertical</span><b>⇧V</b>
                </button>
                <button data-relation="coincident" disabled>
                  <svg class="i" width="16" height="16"><use href="#i-coincident" /></svg><span>Coincident</span><b>⇧C</b>
                </button>
                <button data-relation="fix" disabled>
                  <svg class="i" width="16" height="16"><use href="#i-fix" /></svg><span>Fix</span><b>⇧F</b>
                </button>
              </div>
            </div>
          </section>

          <section class="panel" id="p-rels">
            <button class="panel-head" aria-expanded="true">
              <svg class="i" width="12" height="12"><use href="#i-caret" /></svg><span>Relations</span>
              <span class="count" id="relation-count">0</span>
            </button>
            <div class="panel-body tight">
              <div id="relations" class="relations"></div>
              <p class="empty" id="relations-empty">
                Select two points, then add a relation or a dimension.
              </p>
            </div>
          </section>
        </aside>
      </div>

      <footer class="statusbar">
        <span id="status-dot" class="dotc"></span>
        <span id="status-text">&nbsp;</span>
        <span class="stat" id="dof"></span>
        <span class="hint" id="hint"></span>
        <span class="coords" id="coords">X 0.00  Y 0.00 px</span>
      </footer>
    </div>

    <dialog id="output">
      <form method="dialog" class="output-head">
        <h2 id="output-title">Export</h2>
        <button value="close">Close</button>
      </form>
      <p class="output-note" id="output-note"></p>
      <textarea id="output-text" readonly spellcheck="false" aria-label="File contents"></textarea>
      <div class="output-actions">
        <button data-action="copy">Copy to clipboard</button>
        <button data-action="download">Download</button>
      </div>
    </dialog>
  </body>
</html>
